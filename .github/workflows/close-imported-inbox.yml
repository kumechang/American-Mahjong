# 取り込み済みの inbox/ ブランチと PR を自動で片付ける。
# 取り込みの PR(data/inbox/<id>/ の生データを保存したもの)が main に入ったら、
# 同じ <id> の inbox/<id> ブランチの PR を閉じ、ブランチを削除する。
name: close-imported-inbox
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Close imported inbox PRs and delete their branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in $(git ls-remote --heads origin 'refs/heads/inbox/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            id="${branch#inbox/}"
            [[ $id =~ ^[0-9A-Za-z._-]+$ ]] || { echo "skip odd branch: $branch"; continue; }
            if [ -d "data/inbox/$id" ]; then
              echo "imported: $branch"
              pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
              if [ -n "$pr" ]; then
                gh pr close "$pr" --comment "取り込み済み(data/inbox/$id が main にあります)のため自動で閉じました。

---
_Generated by [Claude Code](https://claude.ai/code)_"
              fi
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || true
            else
              echo "not imported yet: $branch"
            fi
          done
