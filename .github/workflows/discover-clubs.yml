# 毎日、Bam Good Time のクラブ一覧(都市ごとのページ)を 100 都市ずつ読み、サイトにまだない団体を探す。
# 見つかった団体は inbox/discover-… ブランチの PR にまとめる(全部 NEEDS_REVIEW。American / NMJL の確認は人か AI サーバーが行う)。
# 起動は cron-job.org から workflow_dispatch。データベースには何も書かない。
name: discover-clubs
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "読む都市ページの数(100 で約 12 日で一周)"
        default: "100"
      runs_per_day:
        description: "(使わない。古い cron-job.org の本文が残っていても失敗しないよう残してある。範囲は実行番号で自動的に進む)"
        default: "1"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: discover-clubs
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ブラウザを入れる(Eventbrite は普通の取得を弾くので、ブラウザで開く)
        run: npx playwright-core install --with-deps chromium
      - name: ローカル DB を作る
        run: npx wrangler d1 migrations apply DB --local
      - name: 探す
        id: discover
        env:
          BATCH: ${{ inputs.batch }}
          STEP: ${{ github.run_number }}
        run: |
          set +e
          [[ "${BATCH:-100}" =~ ^[0-9]{1,3}$ ]] || { echo "不正な batch"; exit 1; }
          id="discover-$(date -u +%Y-%m-%d-%H%M)"
          node scripts/discover-clubs.mjs --batch="${BATCH:-100}" --step="${STEP}" --out-dir="data/inbox/$id" | tee summary.md
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || exit "$rc"
          # 二つ目の情報源: BamBuddies の American 専門ディレクトリ(手がかりだけ。bb-… フォルダに出る)
          node scripts/discover-bambuddies.mjs --out-dir="data/inbox/$id" | tee -a summary.md
          rc2=${PIPESTATUS[0]}
          [ "$rc2" -eq 0 ] || [ "$rc2" -eq 3 ] || exit "$rc2"
          # 三つ目の情報源: Mahjong 4 Friends の講師ディレクトリ(手がかりだけ。m4f-… フォルダに出る。電話・メールは読まない)
          node scripts/discover-mahjong4friends.mjs --out-dir="data/inbox/$id" | tee -a summary.md
          rc3=${PIPESTATUS[0]}
          [ "$rc3" -eq 0 ] || [ "$rc3" -eq 3 ] || exit "$rc3"
          # 四つ目の情報源: Eventbrite の検索(日付・会場・主催者つきのイベント。eb-… フォルダに出る。失敗しても他の結果は残す)
          node scripts/discover-eventbrite.mjs --batch=20 --max=50 --step="${STEP}" --out-dir="data/inbox/$id" | tee -a summary.md
          rc4=${PIPESTATUS[0]}
          [ "$rc4" -eq 0 ] || [ "$rc4" -eq 3 ] || { echo "::warning::Eventbrite の探索が失敗しました(終了コード $rc4)"; rc4=3; }
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 3 ] && [ "$rc2" -eq 3 ] && [ "$rc3" -eq 3 ] && [ "$rc4" -eq 3 ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: 検証して PR を作る
        if: steps.discover.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.discover.outputs.id }}
        run: |
          set +e
          report="$PWD/pr-body.md"
          echo "## Club discovery \`$ID\`" > "$report"
          cat summary.md >> "$report"
          for dir in data/inbox/$ID/*/; do
            [ -f "$dir/clubs.csv" ] || [ -f "$dir/instructors.csv" ] || [ -f "$dir/events.csv" ] || continue
            echo "" >> "$report"
            echo "### \`$dir\`" >> "$report"
            echo '```' >> "$report"
            args=()
            [ -f "$dir/clubs.csv" ] && args+=("--clubs=$dir/clubs.csv")
            [ -f "$dir/instructors.csv" ] && args+=("--instructors=$dir/instructors.csv")
            [ -f "$dir/events.csv" ] && args+=("--events=$dir/events.csv")
            node scripts/validate-csv.mjs "${args[@]}" >> "$report" 2>&1
            echo '```' >> "$report"
          done
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "inbox/$ID"
          git add "data/inbox/$ID"
          git commit -m "Club discovery results $ID"
          git push origin "inbox/$ID"
          gh pr create --base main --head "inbox/$ID" --title "Inbox: inbox/$ID (club discovery)" --body-file "$report"
      # 結果を人が見なくても取り込む(失敗しても上の PR は残る)。詳しくは auto-import.yml
      - name: 自動取り込みを起こす
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-import.yml || echo "::warning::auto-import を起こせませんでした"
