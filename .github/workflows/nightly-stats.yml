# 夜間リサーチの週次の数字(実行回数・訪問・CSV を出した割合・ACTIVE 行・DUPLICATE_OF・同じ町の再訪・Chrome 調査待ち)を
# ジョブのサマリーに出す。データは data/inbox と、開いている inbox/* ブランチから読むだけ。
name: nightly-stats
on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "何週間分を出すか"
        default: "6"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 集計
        env:
          WEEKS: ${{ inputs.weeks }}
        run: |
          [[ "${WEEKS:-6}" =~ ^[0-9]{1,2}$ ]] || { echo "不正な weeks"; exit 1; }
          { echo "## 夜間リサーチの週次集計"; node scripts/nightly-stats.mjs --weeks="${WEEKS:-6}" --branches; } | tee -a "$GITHUB_STEP_SUMMARY"
      # 定期ワークフローが黙って失敗し続けていないか(crawl-events は 10-29 から 3 週間失敗していて、誰も気づかなかった)
      - name: 定期ワークフローの直近 7 回
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo ""
            echo "## 定期ワークフローの直近 7 回(success / failure)"
            for wf in crawl-events discover-clubs auto-import nightly-research freshness; do
              res=$(gh run list --workflow="$wf.yml" --limit 7 --json conclusion --jq '[.[].conclusion] | join(" ")' 2>/dev/null || echo "?")
              bad=$(echo "$res" | tr ' ' '\n' | grep -c failure || true)
              echo "- $wf: $res $([ "$bad" -ge 3 ] && echo '**← 3 回以上失敗**')"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
